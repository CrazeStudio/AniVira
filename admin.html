<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff"><title>Studio — AniVira</title><link rel="stylesheet" href="/assets/styles.css"></head><body class="admin-body"><header class="admin-top"><a class="admin-brand" href="/">AniVira <span>STUDIO</span></a><a href="/" class="quiet-link">← Website</a></header><main class="admin-shell"><section id="login-panel" class="login-panel"><p class="eyebrow">PRIVATE WORKSPACE</p><h1>Studio login</h1><p class="admin-muted">Sign in to manage anime and viewing sources.</p><form id="login-form"><label for="password">Admin password</label><input id="password" type="password" autocomplete="current-password" required><button class="admin-button">Sign in</button><p id="login-error" class="error" role="alert"></p></form></section>
<section id="dashboard" hidden><div class="admin-heading"><div><p class="eyebrow">CONTENT MANAGEMENT</p><h1>Studio</h1><p class="admin-muted">Manage your catalogue and viewing links.</p></div><button id="logout" class="outline-button">Sign out</button></div><div class="admin-tabs"><button class="tab active" data-tab="anime">Anime</button><button class="tab" data-tab="sources">Viewing sources</button></div>
<section id="anime-tab" class="admin-card"><h2>Add anime</h2><form id="anime-search-form" class="admin-search"><input id="anime-query" placeholder="Search AniList by title…" required><button class="admin-button">Search</button></form><div id="anime-results" class="admin-results"></div><h2 class="subheading">Managed anime</h2><div id="managed-anime" class="managed-list"></div></section>
<section id="sources-tab" class="admin-card" hidden><h2>Add a viewing source</h2><form id="source-form" class="source-form"><label>Anime<select id="source-anime" required><option value="">Choose anime</option></select></label><label>Source name<input id="source-label" placeholder="Official channel / provider" required></label><label>Viewing URL<input id="source-url" type="url" placeholder="https://…" required></label><div class="form-row"><label>Language<input id="source-language" placeholder="Japanese / Hindi / English"></label><label>Quality<input id="source-quality" placeholder="1080p / 720p"></label></div><button class="admin-button">Save source</button></form><div id="managed-sources" class="managed-list"></div></section><p id="admin-message" class="admin-muted" role="status"></p></section></main><script src="/assets/admin.js" defer></script></body></html>
