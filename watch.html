<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0912"><title>Watch · AniVira</title><style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap');:root{color-scheme:dark;--bg:#0b0912;--panel:#15121e;--muted:#aaa3b7;--line:#ffffff18;--purple:#9b72f2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#faf8ff;font:14px 'DM Sans',sans-serif}.top{height:68px;display:flex;align-items:center;padding:0 5%;border-bottom:1px solid var(--line);gap:14px}.brand{font:800 24px Manrope;color:white;text-decoration:none}.brand span{color:var(--purple)}.back{margin-left:auto;color:#d9caff;text-decoration:none}.wrap{width:min(1100px,92%);margin:28px auto}.layout{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(250px,.8fr);gap:20px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:18px}.player{aspect-ratio:16/9;background:#050408;border-radius:12px;overflow:hidden;display:grid;place-items:center}.player video{width:100%;height:100%;background:#000}.placeholder{text-align:center;color:var(--muted);padding:25px}.placeholder strong{display:block;color:#fff;margin-bottom:8px}.field,button{font:inherit}.field{width:100%;background:#0e0b15;border:1px solid var(--line);border-radius:10px;padding:11px;color:#fff;margin:8px 0 14px}.btn{display:inline-flex;background:#9b72f2;color:white;border:0;border-radius:10px;padding:11px 15px;text-decoration:none;font-weight:800;cursor:pointer}.muted{color:var(--muted);line-height:1.6}.episode{padding:12px;border:1px solid var(--line);border-radius:10px;margin:8px 0;cursor:pointer}.episode.active{border-color:var(--purple);background:#9b72f21a}.source-link{display:block;color:#d7c7ff;padding:9px 0;overflow-wrap:anywhere}.title{font:800 26px Manrope;margin:18px 0 8px}.status{font-size:12px;color:var(--muted);margin-top:10px}@media(max-width:760px){.layout{grid-template-columns:1fr}.wrap{margin:18px auto}.top{padding:0 4%}}
</style></head><body><header class="top"><a class="brand" href="./index.html">Ani<span>Vira</span></a><a class="back" href="./index.html">← Back to catalogue</a></header><main class="wrap"><div class="layout"><section><div class="panel"><div class="player" id="player"><div class="placeholder"><strong>Preparing your episode</strong><span id="playerMessage">Loading episode details…</span></div></div><h1 class="title" id="animeTitle">AniVira Player</h1><div class="muted" id="episodeTitle">Choose an episode and an authorized source.</div><div class="status" id="status"></div></div><div class="panel" style="margin-top:16px"><h2>Available sources</h2><select class="field" id="sourceSelect" aria-label="Choose source"><option value="">Loading sources…</option></select><div id="sourceInfo" class="muted">Only official or authorized sources are shown.</div><a id="openSource" class="btn" href="#" target="_blank" rel="noopener noreferrer" hidden>Open provider ↗</a></div></section><aside class="panel"><h2>Episodes</h2><div id="episodeList" class="muted">Loading episodes…</div></aside></div></main><script src="./assets/config.js"></script><script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script><script>
const $=s=>document.querySelector(s),params=new URLSearchParams(location.search),animeId=params.get("anime"),initialEpisode=params.get("episode");const base=(localStorage.getItem("anivira_api_base")||window.ANIVIRA_API_BASE||"").replace(/\/+$/,"");let anime=null,episode=null,sources=[],hls=null;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function stopPlayer(){if(hls){hls.destroy();hls=null}const p=$("#player");p.innerHTML='<div class="placeholder"><strong>Source not loaded</strong><span id="playerMessage">Choose an authorized source.</span></div>'}
function chooseEpisode(id){episode=anime.episodes.find(e=>e.id===id)||anime.episodes[0];if(!episode)return;$("#episodeTitle").textContent="Episode "+episode.episode_number+" · "+(episode.title||"");document.querySelectorAll(".episode").forEach(x=>x.classList.toggle("active",x.dataset.id===episode.id));const matching=anime.sources.filter(s=>!s.episode_id||s.episode_id===episode.id);sources=matching;$("#sourceSelect").innerHTML=matching.length?matching.map((s,i)=>'<option value="'+i+'">'+esc(s.provider)+" · "+esc(s.language||s.source_type)+'</option>').join(""):'<option value="">No authorized sources available</option>';selectSource()}
function selectSource(){stopPlayer();const s=sources[Number($("#sourceSelect").value)];const open=$("#openSource");if(!s){open.hidden=true;$("#sourceInfo").textContent="No official or authorized source has been added for this episode.";return}open.href=s.url;open.hidden=false;$("#sourceInfo").textContent=s.provider+" · "+(s.language||"Language not specified")+" · "+s.source_type;const url=s.url;const direct=/\.(mp4|webm|m4v)(\?|#|$)/i.test(url),hls=/\.m3u8(\?|#|$)/i.test(url);if(direct){$("#player").innerHTML='<video controls playsinline preload="metadata"></video>';$("#player video").src=url;$("#status").textContent="Direct media source. Playback depends on provider permissions and CORS."}else if(hls){if($("#player video")?.canPlayType("application/vnd.apple.mpegurl")){$("#player").innerHTML='<video controls playsinline></video>';$("#player video").src=url}else if(window.Hls&&Hls.isSupported()){$("#player").innerHTML='<video controls playsinline></video>';hls=new Hls();hls.loadSource(url);hls.attachMedia($("#player video"));hls.on(Hls.Events.ERROR,(_,d)=>{if(d.fatal)$("#status").textContent="Playback was blocked or the stream is unavailable. Use the official provider link."})}else $("#playerMessage").textContent="This browser cannot play HLS directly. Open the official provider."}else{$("#playerMessage").textContent="This URL is a provider page, not a direct video file. Use the official provider button.";$("#status").textContent="AniVira does not proxy third-party video or bypass provider restrictions."}}
async function init(){if(!base||!animeId){$("#playerMessage").textContent="Set the public Worker URL in assets/config.js and open a valid anime episode.";return}try{const r=await fetch(base+"/api/anime/"+encodeURIComponent(animeId));if(!r.ok)throw Error();anime=(await r.json()).data;$("#animeTitle").textContent=anime.title;$("#episodeList").innerHTML=anime.episodes.length?anime.episodes.map(e=>'<div class="episode" data-id="'+esc(e.id)+'">Episode '+esc(e.episode_number)+' · '+esc(e.title||"")+'</div>').join(""):'No episodes have been added.';document.querySelectorAll(".episode").forEach(el=>el.onclick=()=>chooseEpisode(el.dataset.id));$("#sourceSelect").onchange=selectSource;chooseEpisode(initialEpisode||anime.episodes[0]?.id)}catch(e){$("#playerMessage").textContent="Could not load this anime. Check the Worker URL and database connection."}}
init();
</script></body></html>
